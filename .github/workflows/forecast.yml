name: forecast
on:
  workflow_run:
    workflows: ["ob-level"]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: forecast
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/zahar_forecast.js
      - run: node scripts/zahar_klev.js
      - name: commit
        run: |
          git config user.name "ob-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/forecast.json data/klev.json
          git diff --cached --quiet || git commit -m "прогноз и клёв: авто-обновление"
          git pull --rebase origin main
          git push
