name: ob-level
on:
  schedule:
    # 6:00, 12:00, 18:00, 24:00 по Барнаулу (UTC+7) = 23:00, 05:00, 11:00, 17:00 UTC 
    - cron: '7 23,5,11,17 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ob-level
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/zahar_ob.js
      - name: commit
        run: |
          git config user.name "ob-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ob-level.json
          git diff --cached --quiet || git commit -m "уровень Оби: авто-обновление"
          git pull --rebase origin main
          git push
