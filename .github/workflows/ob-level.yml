name: ob-level
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/zahar_ob.js
      - name: commit
        run: |
          git config user.name "ob-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ob-level.json
          git diff --cached --quiet || git commit -m "уровень Оби: авто-обновление"
          git push

