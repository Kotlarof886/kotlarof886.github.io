name: Погода сейчас
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  now:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Текущая погода → data/wxnow.json
        run: |
          curl -s "https://api.open-meteo.com/v1/forecast?latitude=53.35&longitude=83.78&current=temperature_2m" -o /tmp/om.json
          T=$(node -e "const d=require('/tmp/om.json');console.log(d.current.temperature_2m)")
          node -e "const fs=require('fs');fs.writeFileSync('data/wxnow.json',JSON.stringify({t:parseFloat(process.argv[1]),ts:Date.now(),source:'open-meteo.com'},null,2))" "$T"
          cat data/wxnow.json
      - name: Записать
        run: |
          git config user.name "weather-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/wxnow.json
          git diff --cached --quiet || git commit -m "погода сейчас $(date -u +%H:%M)"
          git push
