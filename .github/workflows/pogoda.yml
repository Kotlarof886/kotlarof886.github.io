name: Погода сейчас
on:
  schedule:
    - cron: '*/30 * * * *'      # каждые 30 минут 
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: pogoda
  cancel-in-progress: false
jobs:
  now:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Текущая погода → data/wxnow.json
        run: |
          curl -s "https://api.open-meteo.com/v1/forecast?latitude=53.35&longitude=83.78&current=temperature_2m,wind_speed_10m,wind_direction_10m,precipitation,weather_code,cloud_cover" -o /tmp/om.json
          node -e "const fs=require('fs');const c=JSON.parse(fs.readFileSync('/tmp/om.json','utf8')).current;fs.writeFileSync('data/wxnow.json',JSON.stringify({t:Math.round(c.temperature_2m*10)/10,ws:Math.round(c.wind_speed_10m*10)/10,wd:Math.round(c.wind_direction_10m),pr:c.precipitation,wc:c.weather_code,cc:c.cloud_cover,ts:Date.now(),source:'open-meteo.com'},null,2))"
          cat data/wxnow.json
      - name: Записать
        run: |
          git config user.name "weather-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/wxnow.json
          git diff --cached --quiet || git commit -m "погода сейчас $(date -u +%H:%M)"
          git pull --rebase origin main
          git push
